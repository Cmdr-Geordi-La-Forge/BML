<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- The Void / Raw Metal Background -->
  <rect width="500" height="500" fill="#FFFFFF"/>

  <!-- Unyielding Left Parenthesis -->
  <path d="M 130,100 L 80,100 L 40,250 L 80,400 L 130,400 L 90,250 Z" fill="#00FF00"/>

  <!-- Unyielding Right Parenthesis -->
  <path d="M 370,100 L 420,100 L 460,250 L 420,400 L 370,400 L 410,250 Z" fill="#FFFF00"/>

  <!-- The Monolithic Lambda -->
  <path d="M 250,100 L 350,400 L 300,400 L 250,250 L 200,400 L 150,400 Z" fill="#FF0000"/>
</svg>
